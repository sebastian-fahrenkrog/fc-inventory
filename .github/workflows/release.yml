name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: sodium, zip
          coverage: none
      - name: Test
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
      - name: Build ZIP, manifest and signature
        env:
          FC_INVENTORY_SIGNING_KEY: ${{ secrets.FC_INVENTORY_SIGNING_KEY }}
        run: php scripts/build-release.php --version="${GITHUB_REF_NAME#v}" --out=dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/fc-inventory.zip dist/fc-inventory.json dist/fc-inventory.json.sig \
            --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md --verify-tag
